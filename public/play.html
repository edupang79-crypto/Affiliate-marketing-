<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>빙고 참가</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
#join{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
#join .panel{width:min(440px,100%)}
#join h1{text-align:center;font-size:40px;margin:0 0 4px}
#join label{display:block;font-weight:700;margin:16px 0 6px}
#codeIn{font-size:34px;letter-spacing:10px;text-align:center;font-family:'Black Han Sans',sans-serif}
.err{color:var(--bad);text-align:center;min-height:1.4em;margin:10px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.me{font-family:'Black Han Sans',sans-serif;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .btn{padding:8px 10px}
.status{text-align:center;padding:18px;font-size:18px;font-weight:700}
.status .big{font-size:56px;display:block;margin-bottom:6px}
.answer-row{display:flex;gap:8px;margin-top:14px}
.answer-row .field{min-width:0;flex:1}
.go{padding:0 20px;border-radius:14px;background:var(--good);color:#04261a;font-weight:900;font-size:20px}
.go:disabled{opacity:.4}
.result{margin-top:12px;text-align:center;font-weight:900;font-size:20px;min-height:1.3em}
.board-wrap{margin-top:14px}
.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rank-mini{margin-top:14px;font-size:14px}
.rank-mini li{padding:6px 10px}
.qcard .chosung{font-size:clamp(36px,12vw,60px);letter-spacing:6px}
.qcard .chosung.long{font-size:clamp(26px,8vw,40px);letter-spacing:1px}
.qcard .desc{font-size:19px}
</style>
</head>
<body>

<section id="join">
  <div class="panel">
    <h1 class="tf grad">🎯 빙고 참가</h1>
    <p class="muted" style="text-align:center;margin:0">선생님 화면의 방 번호를 넣으세요</p>
    <form id="joinForm" autocomplete="off">
      <div id="codeRow">
        <label for="codeIn">방 번호</label>
        <input class="field" id="codeIn" inputmode="numeric" maxlength="4" placeholder="0000">
      </div>
      <div id="qrRoom" class="hidden" style="text-align:center;margin-top:16px">
        <span class="muted">QR로 찾은 방</span>
        <div class="tf" style="font-size:44px;letter-spacing:8px;color:var(--accent)" id="qrRoomCode"></div>
        <button type="button" class="muted" style="background:none;text-decoration:underline;font-size:13px" id="otherRoom">다른 방 번호 넣기</button>
      </div>
      <label for="nameIn">내 이름</label>
      <input class="field" id="nameIn" maxlength="10" placeholder="예: 김철수">
      <button class="big-btn" style="margin-top:20px" type="submit">입장하기 ▶</button>
      <p class="err" id="joinErr"></p>
    </form>
  </div>
</section>

<section id="game" class="hidden">
  <div class="wrap">
    <div class="top">
      <span class="me" id="meName"></span>
      <span style="display:flex;gap:6px;align-items:center">
        <span class="dots" id="meDots"></span>
        <button class="btn" id="soundBtn">🔊</button>
      </span>
    </div>

    <div class="panel status" id="waitBox">
      <span class="big">⏳</span>
      <span id="waitText">입장 완료! 선생님이 시작하면 문제가 나와요</span>
    </div>

    <div class="panel qcard hidden" id="qcard">
      <span class="topic" id="qTopic"></span>
      <div class="timer" id="timer">
        <svg viewBox="0 0 60 60" width="58" height="58">
          <circle cx="30" cy="30" r="26" fill="none" stroke="#343a6e" stroke-width="6"/>
          <circle id="timerArc" cx="30" cy="30" r="26" fill="none" stroke="#ffd23f" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.4"/>
        </svg>
        <span id="timerNum"></span>
      </div>
      <div class="chosung" id="qChosung"></div>
      <div class="desc" id="qDesc"></div>
      <div class="hint" id="qHint"></div>
      <form class="answer-row" id="ansForm" autocomplete="off">
        <input class="field" id="ansIn" placeholder="정답 입력 (기회는 한 번!)" enterkeyhint="send">
        <button class="go" id="goBtn" type="submit">확인</button>
      </form>
      <div class="result" id="result"></div>
    </div>

    <div class="board-wrap">
      <div class="board-head">
        <span class="tf" style="font-size:20px">내 빙고판</span>
        <span class="muted" id="goalText"></span>
      </div>
      <div class="grid" id="board"></div>
    </div>
  </div>
</section>

<div class="overlay hidden" id="winner">
  <div class="box">
    <div class="trophy" id="winIcon">🏆</div>
    <div class="win-name" id="winName"></div>
    <div class="muted" id="winSub"></div>
    <ol class="rank-list rank-mini" id="winRank"></ol>
    <button class="btn primary" style="width:100%" id="closeWin">내 빙고판 보기</button>
  </div>
</div>

<script src="/fx.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me = null, es = null, S = null, offset = 0, timerIv = null, shownWin = null, lastQ = null, prevMarked = [];

const params = new URLSearchParams(location.search);
if(/^\d{4}$/.test(params.get('code')||'')){
  // QR로 들어오면 방 번호는 채워 두고 이름만 받습니다
  $('codeIn').value = params.get('code');
  $('qrRoomCode').textContent = params.get('code');
  $('codeRow').classList.add('hidden'); $('qrRoom').classList.remove('hidden');
}
$('otherRoom').onclick = ()=>{ $('qrRoom').classList.add('hidden'); $('codeRow').classList.remove('hidden'); $('codeIn').value=''; $('codeIn').focus(); };
try{
  const saved = JSON.parse(localStorage.getItem('bingoPlayer')||'null');
  if(saved && saved.pid && (!params.get('code') || params.get('code')===saved.code)){ me = saved; connect(); }
  else if(saved && saved.name) $('nameIn').value = saved.name;
}catch{}
if(!me) setTimeout(()=> ($('codeIn').value ? $('nameIn') : $('codeIn')).focus(), 100);

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || '오류가 났어요');
  return j;
}

$('joinForm').onsubmit = async e=>{
  e.preventDefault();
  FX.unlock();
  const code = $('codeIn').value.trim(), name = $('nameIn').value.trim();
  if(!/^\d{4}$/.test(code)) return $('joinErr').textContent = '방 번호 4자리를 넣어 주세요';
  if(!name) return $('joinErr').textContent = '이름을 넣어 주세요';
  try{
    const r = await post('/api/join', {code, name});
    me = {code, pid:r.pid, name:r.name};
    try{ localStorage.setItem('bingoPlayer', JSON.stringify(me)); }catch{}
    FX.sfx.join();
    connect();
  }catch(err){ $('joinErr').textContent = err.message; }
};

function connect(){
  $('join').classList.add('hidden'); $('game').classList.remove('hidden');
  $('meName').textContent = me.name;
  es && es.close();
  es = new EventSource(`/api/events?code=${me.code}&pid=${me.pid}`);
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = ()=>{
    if(es.readyState === EventSource.CLOSED){
      // 방이 없어졌거나 내보내진 경우: 다시 입장
      try{ localStorage.setItem('bingoPlayer', JSON.stringify({name:me.name})); }catch{}
      $('nameIn').value = me.name; me = null;
      $('game').classList.add('hidden'); $('winner').classList.add('hidden'); $('join').classList.remove('hidden');
      $('joinErr').textContent = '방에서 나왔어요. 방 번호를 확인하고 다시 들어오세요';
    }
  };
}
// 새로고침으로 다시 들어온 경우를 대비해 첫 터치에서 소리를 켭니다
addEventListener('pointerdown', ()=>FX.unlock(), {once:true});

function render(s){
  const prev = S; S = s; offset = s.serverNow - Date.now();
  const goal = s.settings.lines;
  $('meDots').innerHTML = Array.from({length:goal},(_,k)=>`<i class="${k<s.me.lines?'on':''}"></i>`).join('');
  $('goalText').textContent = `${s.me.place ? MEDAL[s.me.place]+' ' : ''}${s.me.lines} / ${goal}줄 · 정답 ${s.me.correct}개 · ${s.me.rank}등`;

  // 빙고판
  const lc = new Set(s.me.lineCells);
  $('board').innerHTML = s.me.board.map((w,i)=>`<div class="cell ${s.me.marked[i]?'marked':''} ${lc.has(i)?'inline':''} ${s.me.marked[i]&&!prevMarked[i]&&prev?'pop':''}">${esc(w)}</div>`).join('');
  prevMarked = s.me.marked;

  const q = s.q;
  const asking = s.status==='question';
  $('waitBox').classList.toggle('hidden', !!q && s.status!=='lobby');
  $('qcard').classList.toggle('hidden', !q || s.status==='lobby');
  if(s.status==='lobby'){
    $('waitText').textContent = '입장 완료! 선생님이 시작하면 문제가 나와요';
  }
  if(q && s.status!=='lobby'){
    const isNew = lastQ !== q.no;
    lastQ = q.no;
    $('qTopic').textContent = q.topic;
    $('qChosung').textContent = q.chosung;
    $('qChosung').classList.toggle('long', q.eng || q.chosung.length > 8);
    $('qDesc').textContent = q.desc;
    $('qHint').textContent = q.hint ? `💡 힌트: ${q.hint}` : '';
    const answered = s.me.ans;
    const canAnswer = asking && !answered;
    $('ansIn').disabled = !canAnswer; $('goBtn').disabled = !canAnswer;
    if(isNew){ $('ansIn').value=''; $('result').textContent=''; $('qcard').className='panel qcard'; if(canAnswer) setTimeout(()=>$('ansIn').focus(),50); FX.sfx.click(); }
    if(!asking && q.answer){
      $('result').innerHTML = answered==='correct' ? `⭕ 정답 「${esc(q.answer)}」` : `정답은 <span style="color:var(--accent)">「${esc(q.answer)}」</span>`;
      if(!answered && prev && prev.status==='question') { FX.bomb(); FX.say('시간 끝! 💥','#ff4d6d'); }
    } else if(answered==='wrong'){
      $('result').innerHTML = '<span style="color:var(--bad)">💥 땡! 다음 문제를 기다려요</span>';
    } else if(answered==='correct'){
      $('result').innerHTML = '<span style="color:var(--good)">⭕ 정답!</span>';
    } else $('result').textContent='';
    runTimer(asking && !answered && q.endsAt);
  }
  renderWinner(s, prev);
}

$('ansForm').onsubmit = async e=>{
  e.preventDefault();
  const text = $('ansIn').value.trim();
  if(!text) return;
  $('goBtn').disabled = true; $('ansIn').disabled = true;
  try{
    const r = await post('/api/answer', {code:me.code, pid:me.pid, text});
    if(r.result==='correct'){
      $('qcard').className='panel qcard correct';
      FX.fireworks(r.newLines ? 8 : 5); FX.sfx.win();
      if(navigator.vibrate) navigator.vibrate(80);
      if(r.won) return; // 우승 화면에서 처리
      if(r.newLines) setTimeout(()=>{ FX.say(`🎉 ${r.lines}줄 빙고!`, '#ffd23f'); FX.sfx.bingo(); }, 600);
      else FX.say(r.onBoard ? '정답! 칸 지우기 ✔' : '정답! (내 판엔 없음)', '#2ee59d');
    } else {
      $('qcard').className='panel qcard wrong';
      FX.bomb(); FX.say('땡! 💥', '#ff4d6d');
    }
  }catch(err){
    FX.say(err.message, '#ffd23f');
  }
};

function runTimer(endsAt){
  clearInterval(timerIv);
  $('timer').classList.toggle('hidden', !endsAt);
  if(!endsAt) return;
  const total = S.settings.time;
  let lastSec = null;
  const draw = ()=>{
    const left = Math.max(0, Math.ceil((endsAt - (Date.now()+offset))/1000));
    $('timerNum').textContent = left;
    $('timerArc').style.strokeDashoffset = 163.4*(1-left/total);
    $('timerArc').style.stroke = left<=5 ? '#ff4d6d' : '#ffd23f';
    $('timer').classList.toggle('urgent', left<=5 && left>0);
    if(left!==lastSec && left<=5 && left>0) FX.sfx.tick();
    lastSec = left;
    if(left<=0) clearInterval(timerIv);
  };
  draw(); timerIv = setInterval(draw, 250);
}

const MEDAL = {1:'🥇',2:'🥈',3:'🥉'};
function topList(s){
  $('winRank').innerHTML = s.top.map((p,i)=>`<li><span>${p.place?MEDAL[p.place]:i+1+'.'} ${esc(p.name)}</span><span>${p.lines}줄 · 정답 ${p.correct}</span></li>`).join('');
}
function renderWinner(s, prev){
  if(s.status==='lobby'){ $('winner').classList.add('hidden'); shownWin=null; FX.stopMusic(); return; }
  const before = prev ? prev.winners : s.winners; // 새로고침 직후에는 지난 시상을 다시 띄우지 않습니다
  const fresh = s.winners.filter(w=>!before.some(x=>x.id===w.id));

  // 내가 1·2·3등에 들었을 때: 메달 화면 + 음악. 게임은 계속돼서 남은 문제도 풀 수 있어요
  const mine = fresh.find(w=>w.id===s.me.id);
  if(mine){
    $('winIcon').textContent = MEDAL[mine.place];
    $('winName').textContent = `${mine.place}등! 🎉`;
    $('winSub').textContent = `${s.settings.lines}줄 빙고를 ${mine.place}번째로 완성했어요! 남은 문제도 계속 풀 수 있어요`;
    $('closeWin').textContent = '계속 풀기 ▶';
    topList(s);
    $('winner').classList.remove('hidden');
    FX.playMusic(); FX.fireworks(8);
    let n=0; const iv=setInterval(()=>{ FX.fireworks(4); if(++n>=6) clearInterval(iv); }, 1500);
  } else if(fresh.length){
    const w = fresh[fresh.length-1];
    FX.say(`${MEDAL[w.place]} ${w.name} ${w.place}등!`, '#ffd23f');
    FX.fireworks(3); FX.sfx.bingo();
  }

  if(s.status!=='over' || shownWin==='over') return;
  shownWin = 'over';
  clearInterval(timerIv);
  $('ansIn').disabled = true; $('goBtn').disabled = true;
  topList(s);
  $('closeWin').textContent = '내 빙고판 보기';
  $('winIcon').textContent = s.me.place ? MEDAL[s.me.place] : '🏁';
  $('winName').textContent = s.me.place ? `최종 ${s.me.place}등!` : '수고했어요!';
  $('winSub').textContent = `나는 ${s.me.rank}등 · ${s.me.lines}줄 · ${s.q ? s.q.no : 0}문제 중 ${s.me.correct}개 정답`;
  $('winner').classList.remove('hidden');
  FX.fireworks(4);
}
$('closeWin').onclick = ()=> $('winner').classList.add('hidden');
$('soundBtn').onclick = ()=>{ FX.soundOn = !FX.soundOn; $('soundBtn').textContent = FX.soundOn?'🔊':'🔇'; };
</script>
</body>
</html>
