<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 용어 빙고</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.wrap{width:min(900px,100%)}
h1{font-size:clamp(38px,7vw,64px);margin:0;text-align:center}
.sub{text-align:center;margin:6px 0 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-4px)}
.card .ic{font-size:52px}
.card h2{margin:8px 0 6px;font-size:28px}
.card p{margin:0;color:var(--muted);line-height:1.55}
.card.main{border-color:var(--accent);background:linear-gradient(160deg,#2c2a14,var(--panel) 60%)}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <h1 class="tf grad">🎯 마케팅 용어 빙고</h1>
    <p class="sub muted">3-1 프로모션 기획 ~ 3-5 VIP 마케팅 · 단어 30개</p>
    <div class="cards">
      <a class="card main" href="/host.html">
        <div class="ic">🎓</div>
        <h2 class="tf">선생님 화면</h2>
        <p>방을 만들고 프로젝터에 띄웁니다. 학생 전원이 휴대폰으로 동시에 참가합니다.</p>
      </a>
      <a class="card" href="/play.html">
        <div class="ic">📱</div>
        <h2 class="tf">학생 참가</h2>
        <p>방 번호와 이름을 넣고 들어갑니다. 내 빙고판에서 정답을 맞혀 칸을 지웁니다.</p>
      </a>
      <a class="card" href="/team.html">
        <div class="ic">👥</div>
        <h2 class="tf">한 화면 조별 대항</h2>
        <p>휴대폰 없이 화면 하나로 2~6조가 겨룹니다. 선생님이 대신 입력합니다.</p>
      </a>
    </div>
  </div>
</main>
</body>
</html>
